<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Line Following Drone — 3D Simulator</title>
    <meta name="description" content="Interactive 3D simulation of an autonomous line-following drone with real-time PID control tuning.">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>

    <!-- ====== Header ====== -->
    <header id="header">
        <div class="header-left">
            <span class="logo-icon">🚁</span>
            <h1>Line Following Drone</h1>
            <span class="badge">3D SIMULATOR</span>
        </div>
        <div class="header-right">
            <span id="fps-counter" class="fps">-- FPS</span>
        </div>
    </header>

    <!-- ====== 3D Canvas ====== -->
    <div id="canvas-container"></div>

    <!-- ====== Downward FPV HUD (OpenCV vision simulation) ====== -->
    <div id="camera-hud-container">
        <div class="camera-hud-header">
            <span>Downward FPV Cam</span>
            <span class="live-rec"><span class="live-dot"></span> LIVE</span>
        </div>
        <canvas id="drone-cam-canvas" width="240" height="180"></canvas>
    </div>

    <!-- ====== Control Panel (Right Sidebar) ====== -->
    <aside id="controls">

        <section class="ctrl-section">
            <h3>⚡ Simulation</h3>
            <div class="btn-row">
                <button id="btn-play" class="btn btn-primary">▶ Play</button>
                <button id="btn-pause" class="btn btn-secondary" disabled>⏸ Pause</button>
                <button id="btn-reset" class="btn btn-outline">↺ Reset</button>
            </div>
        </section>

        <section class="ctrl-section">
            <h3>🛤️ Track</h3>
            <select id="track-select" class="select">
                <option value="oval">Oval Circuit</option>
                <option value="figure8">Figure 8</option>
                <option value="scurve">S-Curve</option>
                <option value="complex">Complex Path</option>
            </select>
        </section>

        <section class="ctrl-section">
            <h3>🎛️ PID Controller</h3>
            <div class="slider-row">
                <label>Kp</label>
                <input type="range" id="slider-kp" min="0" max="2" step="0.01" value="0.3">
                <span id="val-kp" class="slider-val">0.30</span>
            </div>
            <div class="slider-row">
                <label>Ki</label>
                <input type="range" id="slider-ki" min="0" max="0.5" step="0.005" value="0.0">
                <span id="val-ki" class="slider-val">0.000</span>
            </div>
            <div class="slider-row">
                <label>Kd</label>
                <input type="range" id="slider-kd" min="0" max="1" step="0.01" value="0.1">
                <span id="val-kd" class="slider-val">0.10</span>
            </div>
        </section>

        <section class="ctrl-section">
            <h3>✈️ Flight</h3>
            <div class="slider-row">
                <label>Speed</label>
                <input type="range" id="slider-speed" min="0.1" max="3.0" step="0.05" value="0.3">
                <span id="val-speed" class="slider-val">0.30 m/s</span>
            </div>
            <div class="slider-row">
                <label>Altitude</label>
                <input type="range" id="slider-alt" min="0.5" max="5.0" step="0.1" value="2.0">
                <span id="val-alt" class="slider-val">2.0 m</span>
            </div>
            <div class="slider-row">
                <label>Sim&nbsp;Speed</label>
                <input type="range" id="slider-simspeed" min="0.5" max="5.0" step="0.1" value="1.0">
                <span id="val-simspeed" class="slider-val">1.0×</span>
            </div>
        </section>

        <section class="ctrl-section">
            <h3>📷 Camera</h3>
            <div class="btn-row cam-row">
                <button class="btn btn-sm btn-cam active" data-cam="follow">Follow</button>
                <button class="btn btn-sm btn-cam" data-cam="top">Top</button>
                <button class="btn btn-sm btn-cam" data-cam="free">Free</button>
            </div>
        </section>
    </aside>

    <!-- ====== Telemetry Bar (Bottom) ====== -->
    <footer id="telemetry">
        <div class="telem-group">
            <div class="telem-item">
                <span class="telem-label">STATUS</span>
                <span id="telem-status" class="telem-value status-idle">IDLE</span>
            </div>
            <div class="telem-divider"></div>
            <div class="telem-item">
                <span class="telem-label">ERROR</span>
                <span id="telem-error" class="telem-value mono">0.000</span>
            </div>
            <div class="telem-item">
                <span class="telem-label">PID OUT</span>
                <span id="telem-pid" class="telem-value mono">0.000</span>
            </div>
            <div class="telem-divider"></div>
            <div class="telem-item">
                <span class="telem-label">P</span>
                <span id="telem-p" class="telem-value mono term-p">0.000</span>
            </div>
            <div class="telem-item">
                <span class="telem-label">I</span>
                <span id="telem-i" class="telem-value mono term-i">0.000</span>
            </div>
            <div class="telem-item">
                <span class="telem-label">D</span>
                <span id="telem-d" class="telem-value mono term-d">0.000</span>
            </div>
            <div class="telem-divider"></div>
            <div class="telem-item">
                <span class="telem-label">SPEED</span>
                <span id="telem-speed" class="telem-value mono">0.00 m/s</span>
            </div>
            <div class="telem-item">
                <span class="telem-label">ALT</span>
                <span id="telem-altval" class="telem-value mono">0.0 m</span>
            </div>
            <div class="telem-item">
                <span class="telem-label">DIST</span>
                <span id="telem-dist" class="telem-value mono">0.0 m</span>
            </div>
        </div>
    </footer>

    <!-- ====== Three.js via importmap ====== -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.162.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.162.0/examples/jsm/"
        }
    }
    </script>
    <script type="module" src="app.js?v=1.1"></script>

</body>
</html>
